<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 512px;
    height: 512px;
    background: #090d1a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .icon-canvas {
    width: 512px;
    height: 512px;
    background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0c1024 60%, #060814 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Outer ambient glow */
  .glow-ring {
    position: absolute;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(16, 185, 129, 0) 70%);
    filter: blur(20px);
  }
  /* Central Squircle badge */
  .squircle {
    width: 390px;
    height: 390px;
    border-radius: 96px;
    background: linear-gradient(145deg, #131b31 0%, #0d1222 100%);
    border: 3px solid rgba(99, 102, 241, 0.35);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.1);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* Subtle glass sheen */
  .sheen {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 100%);
    border-radius: 96px 96px 0 0;
  }
  /* SVG vector logo */
  svg {
    width: 280px;
    height: 280px;
    z-index: 2;
    filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.5));
  }
</style>
</head>
<body>
<div class="icon-canvas">
  <div class="glow-ring"></div>
  <div class="squircle">
    <div class="sheen"></div>
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#818cf8"/>
          <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#34d399"/>
          <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>

      <!-- Connecting Strategic Tree Branch Lines -->
      <path d="M100 45 L52 118" stroke="url(#indigoGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 0" opacity="0.8"/>
      <path d="M100 45 L148 118" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
      <path d="M52 118 L32 165" stroke="#6366f1" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M52 118 L72 165" stroke="#6366f1" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M148 118 L128 165" stroke="#06b6d4" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M148 118 L168 165" stroke="url(#emeraldGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

      <!-- Leaf Sub-nodes (Level 3) -->
      <circle cx="32" cy="165" r="9" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/>
      <circle cx="72" cy="165" r="9" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/>
      <circle cx="128" cy="165" r="9" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="168" cy="165" r="11" fill="#064e3b" stroke="url(#emeraldGrad)" stroke-width="3.5" filter="url(#glow)"/>
      <circle cx="168" cy="165" r="4.5" fill="#34d399"/>

      <!-- Middle Branch Nodes (Level 2) -->
      <circle cx="52" cy="118" r="18" fill="#131b31" stroke="url(#indigoGrad)" stroke-width="5"/>
      <circle cx="52" cy="118" r="7" fill="#818cf8"/>
      
      <circle cx="148" cy="118" r="18" fill="#131b31" stroke="url(#cyanGrad)" stroke-width="5"/>
      <circle cx="148" cy="118" r="7" fill="#38bdf8"/>

      <!-- Root Strategic Focal Node (Level 1) -->
      <circle cx="100" cy="45" r="28" fill="#1e1b4b" stroke="url(#indigoGrad)" stroke-width="6" filter="url(#glow)"/>
      <circle cx="100" cy="45" r="18" fill="url(#indigoGrad)"/>
      <circle cx="100" cy="45" r="7" fill="#ffffff"/>
    </svg>
  </div>
</div>
</body>
</html>
